name: build-demoparser
# Builds a patched demoparser2 wheel for Windows / Python 3.13 and commits it to wheels/ on this branch.
on:
  push:
    branches: [demoparser-fix]
    paths-ignore: ['wheels/**']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Pin CS2 protobufs (before the 2026-09-23 customname -> customnames rename)
        shell: bash
        run: |
          d=demoparser/src/csgoproto/GameTracking-CS2
          git init -q "$d"
          git -C "$d" remote add origin https://github.com/SteamDatabase/GameTracking-CS2.git
          git -C "$d" fetch -q --depth=1 origin d8e2c7a4f9b86e60d5a1b584a83ee0e15f59cc54
          git -C "$d" checkout -q FETCH_HEAD
      - name: Build wheel
        shell: bash
        run: |
          pip install "maturin>=1.0,<2.0"
          set -o pipefail
          maturin build --release -i python -m demoparser/src/python/Cargo.toml -o wheels 2>&1 | tee build.log
      - name: Commit wheel (or build log on failure)
        if: always()
        shell: bash
        run: |
          mkdir -p wheels
          tail -c 200000 build.log > wheels/build.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add wheels
          git commit -m "Build output [skip ci]"
          git push
